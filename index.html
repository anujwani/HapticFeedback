<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>F1 HLS with Haptics</title>
</head>
<body style="background:#000; color:#fff; font-family:sans-serif; text-align:center;">

  <h1>F1 Trailer with Haptics</h1>
  <video id="video" controls width="640" autoplay playsinline></video>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script>
    const video = document.getElementById('video');
    const hls = new Hls();
    hls.loadSource('https://anujwani.github.io/HapticFeedback/Chunks/F1_trailer.m3u8');
    hls.attachMedia(video);

    let hapticEvents = [];

    function triggerVibration(duration, intensity) {
      if ('vibrate' in navigator) {
        navigator.vibrate(duration);
      }
    }

    function startHapticSync() {
      if (!('vibrate' in navigator) || !hapticEvents.length) return;

      hapticEvents.forEach(e => e.triggered = false);

      function check() {
        const current = video.currentTime;
        for (const event of hapticEvents) {
          if (!event.triggered && current >= event.time) {
            triggerVibration(event.duration, event.intensity);
            event.triggered = true;
          }
        }
        if (!video.paused && !video.ended) {
          requestAnimationFrame(check);
        }
      }

      requestAnimationFrame(check);
    }

    fetch('https://anujwani.github.io/HapticFeedback/haptics.json')
      .then(response => response.json())
      .then(data => {
        hapticEvents = data;
      });

    video.addEventListener('play', startHapticSync);
  </script>
</body>
</html>
